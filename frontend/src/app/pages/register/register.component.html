<section class="register-page">

  <div class="register-card">

    <h1>Créer un compte</h1>

    <p>
      Créez votre compte DataShare pour partager vos fichiers.
    </p>

    <form #registerForm="ngForm" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label for="email">Adresse email</label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          #emailInput="ngModel"
          required
          email
          placeholder="exemple@email.com"
        >

        <p *ngIf="emailInput.invalid && emailInput.touched">
          Veuillez saisir une adresse email valide.
        </p>
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          #passwordInput="ngModel"
          required
          minlength="8"
          placeholder="Au moins 8 caractères"
        >

        <p *ngIf="passwordInput.errors?.['required'] && passwordInput.touched">
          Le mot de passe est obligatoire.
        </p>

        <p *ngIf="passwordInput.errors?.['minlength'] && passwordInput.touched">
          Le mot de passe doit contenir au moins 8 caractères.
        </p>
      </div>

      <button
        type="submit"
        [disabled]="registerForm.invalid"
      >
        Créer mon compte
      </button>

    </form>

    <p *ngIf="message">
      {{ message }}
    </p>

    <p *ngIf="errorMessage">
      {{ errorMessage }}
    </p>

  </div>

</section>
