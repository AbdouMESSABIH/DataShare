<section class="register-page">

  <div class="register-card">

    <h1>
      Créer un compte
    </h1>

    <form
      #registerForm="ngForm"
      (ngSubmit)="onSubmit()"
    >

      <div class="form-group">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          #emailInput="ngModel"
          required
          email
          autocomplete="email"
          placeholder="Saisissez votre email..."
        >

        <p
          class="field-error"
          *ngIf="
            emailInput.invalid
            && emailInput.touched
          "
        >
          Veuillez saisir une adresse email valide.
        </p>

      </div>


      <div class="form-group">

        <label for="password">
          Mot de passe
        </label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          #passwordInput="ngModel"
          required
          minlength="8"
          autocomplete="new-password"
          placeholder="Saisissez votre mot de passe..."
        >

        <p
          class="field-error"
          *ngIf="
            passwordInput.errors?.['minlength']
            && passwordInput.touched
          "
        >
          Au moins 8 caractères sont nécessaires.
        </p>

      </div>


      <div class="form-group">

        <label for="passwordConfirmation">
          Verification du mot de passe
        </label>

        <input
          id="passwordConfirmation"
          type="password"
          name="passwordConfirmation"
          [(ngModel)]="passwordConfirmation"
          #passwordConfirmationInput="ngModel"
          required
          autocomplete="new-password"
          placeholder="Saisissez le à nouveau"
        >

        <p
          class="field-error"
          *ngIf="
            passwordConfirmationInput.touched
            && passwordConfirmation
            && password !== passwordConfirmation
          "
        >
          Les mots de passe ne correspondent pas.
        </p>

      </div>


      <a
        class="switch-link"
        href="/login"
      >
        J'ai déjà un compte
      </a>


      <button
        class="submit-button"
        type="submit"
        [disabled]="
          registerForm.invalid
          || password !== passwordConfirmation
        "
      >
        Créer mon compte
      </button>

    </form>


    <p
      class="success-message"
      *ngIf="message"
      role="status"
    >
      {{ message }}
    </p>


    <p
      class="error-message"
      *ngIf="errorMessage"
      role="alert"
    >
      {{ errorMessage }}
    </p>

  </div>

</section>
