<section class="visitor-home">

  <h1>Tu veux partager un fichier ?</h1>

  <p class="introduction">
    Déposez vos documents, créez un lien de partage
    et choisissez leur durée de disponibilité.
  </p>

  <a
    class="cloud-cta"
    routerLink="/upload"
    aria-label="Commencer le téléversement"
  >
    <svg
        class="cloud-upload-icon"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M7 18a5 5 0 0 1-.7-9.95A6.5 6.5 0 0 1 18.8 9.4 4.3 4.3 0 0 1 18 18"/>
        <path d="M12 21V11"/>
        <path d="m8.5 14.5 3.5-3.5 3.5 3.5"/>
      </svg>
  </a>

  <p class="help-text">
    Cliquez pour commencer
  </p>

  <div class="visitor-actions">
    <a routerLink="/login">Se connecter</a>
    <a routerLink="/register">Créer un compte</a>
  </div>

</section>
