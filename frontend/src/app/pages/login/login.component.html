<section class="login-page">

  <div class="login-card">

    <h1 id="login-title">Se connecter</h1>

    <p>
      Connectez-vous à votre compte DataShare.
    </p>

    <form
      #loginForm="ngForm"
      (ngSubmit)="onSubmit()"
      aria-labelledby="login-title"
    >

      <div class="form-group">

        <label for="email">
          Adresse email
        </label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          #emailInput="ngModel"
          required
          email
          autocomplete="email"
          placeholder="exemple@email.com"
          [attr.aria-invalid]="emailInput.invalid && emailInput.touched"
          [attr.aria-describedby]="
            emailInput.invalid && emailInput.touched
              ? 'email-error'
              : null
          "
        >

        <p
          id="email-error"
          *ngIf="emailInput.invalid && emailInput.touched"
          role="alert"
        >
          Veuillez saisir une adresse email valide.
        </p>

      </div>


      <div class="form-group">

        <label for="password">
          Mot de passe
        </label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          #passwordInput="ngModel"
          required
          autocomplete="current-password"
          placeholder="Votre mot de passe"
          [attr.aria-invalid]="
            passwordInput.invalid && passwordInput.touched
          "
          [attr.aria-describedby]="
            passwordInput.invalid && passwordInput.touched
              ? 'password-error'
              : null
          "
        >

        <p
          id="password-error"
          *ngIf="
            passwordInput.errors?.['required']
            && passwordInput.touched
          "
          role="alert"
        >
          Le mot de passe est obligatoire.
        </p>

      </div>


      <button
        type="submit"
        [disabled]="loginForm.invalid"
      >
        Se connecter
      </button>

    </form>


    <p
      *ngIf="message"
      role="status"
      aria-live="polite"
    >
      {{ message }}
    </p>


    <p
      *ngIf="errorMessage"
      role="alert"
      aria-live="assertive"
    >
      {{ errorMessage }}
    </p>

  </div>

</section>
