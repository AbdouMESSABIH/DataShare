<section class="login-page">

  <div class="login-card">

    <h1 id="login-title">
      Se connecter
    </h1>

    <form
      #loginForm="ngForm"
      (ngSubmit)="onSubmit()"
      aria-labelledby="login-title"
    >

      <div class="form-group">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          #emailInput="ngModel"
          required
          email
          autocomplete="email"
          placeholder="Saisissez votre email..."
          [attr.aria-invalid]="
            emailInput.invalid
            && emailInput.touched
          "
        >

        <p
          class="field-error"
          *ngIf="
            emailInput.invalid
            && emailInput.touched
          "
          role="alert"
        >
          Veuillez saisir une adresse email valide.
        </p>

      </div>


      <div class="form-group">

        <label for="password">
          Mot de passe
        </label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          #passwordInput="ngModel"
          required
          autocomplete="current-password"
          placeholder="Saisissez votre mot de passe..."
          [attr.aria-invalid]="
            passwordInput.invalid
            && passwordInput.touched
          "
        >

        <p
          class="field-error"
          *ngIf="
            passwordInput.errors?.['required']
            && passwordInput.touched
          "
          role="alert"
        >
          Le mot de passe est obligatoire.
        </p>

      </div>


      <a
        class="switch-link"
        href="/register"
      >
        Je n'ai pas encore de compte
      </a>


      <button
        class="submit-button"
        type="submit"
        [disabled]="loginForm.invalid"
      >
        Se connecter
      </button>

    </form>


    <p
      class="success-message"
      *ngIf="message"
      role="status"
      aria-live="polite"
    >
      {{ message }}
    </p>


    <p
      class="error-message"
      *ngIf="errorMessage"
      role="alert"
      aria-live="assertive"
    >
      {{ errorMessage }}
    </p>

  </div>

</section>
