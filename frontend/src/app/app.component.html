<div class="app-shell">

  <header class="app-header">

    <a
      routerLink="/upload"
      class="brand"
    >
      DataShare
    </a>


    <button
      class="mobile-menu-toggle"
      type="button"
      aria-label="Afficher ou masquer la navigation"
      aria-controls="mobile-navigation"
      [attr.aria-expanded]="mobileMenuOpen"
      (click)="toggleMobileMenu()"
    >
      <span aria-hidden="true">☰</span>
    </button>

    <nav
      id="mobile-navigation"
      class="navigation"
      [class.mobile-open]="mobileMenuOpen"
      aria-label="Navigation principale"
    >

      <a
        class="nav-login"
        routerLink="/login"
        (click)="closeMobileMenu()"
      >
        Se connecter
      </a>


      <a
        class="nav-register"
        routerLink="/register"
        (click)="closeMobileMenu()"
      >
        Créer un compte
      </a>


      <a
        class="nav-upload"
        routerLink="/upload"
        (click)="closeMobileMenu()"
      >
        Téléverser
      </a>


      <a
        class="nav-history"
        routerLink="/history"
        (click)="closeMobileMenu()"
      >
        Mon espace
      </a>

      <button
        class="nav-logout"
        type="button"
        (click)="logout()"
      >
        Déconnexion
      </button>

    </nav>

  </header>


  <main class="app-content">

    <router-outlet></router-outlet>

  </main>

  <footer class="app-footer">
    <p>
      © 2026 DataShare — Partage temporaire de fichiers.
    </p>
    <p>
      Liens disponibles de 1 à 7 jours.
    </p>
  </footer>

</div>
