<div class="app-shell">

  <header class="app-header">

    <a
      routerLink="/upload"
      class="brand"
    >
      DataShare
    </a>


    <a
      class="mobile-visitor-action"
      [routerLink]="isAuthenticated ? '/history' : '/login'"
    >
      {{ isAuthenticated ? 'Mon espace' : 'Se connecter' }}
    </a>

    <a
      class="mobile-register-action"
      routerLink="/register"
    >
      Créer un compte
    </a>

    <a
      class="mobile-private-action"
      routerLink="/history"
      (click)="closeMobileMenu()"
    >
      Mon espace
    </a>

    <button
      class="mobile-menu-toggle"
      type="button"
      aria-label="Afficher ou masquer la navigation"
      aria-controls="mobile-navigation"
      [attr.aria-expanded]="mobileMenuOpen"
      (click)="toggleMobileMenu()"
    >
      <span aria-hidden="true">☰</span>
    </button>

    <button
      type="button"
      class="mobile-drawer-backdrop"
      [class.open]="mobileMenuOpen"
      [disabled]="!mobileMenuOpen"
      aria-label="Fermer la navigation"
      (click)="closeMobileMenu()"
    ></button>

    <nav
      id="mobile-navigation"
      class="navigation"
      [class.mobile-open]="mobileMenuOpen"
      aria-label="Navigation principale"
    >
      <div class="mobile-drawer-heading">
        <button
          type="button"
          class="mobile-drawer-close"
          aria-label="Fermer le menu"
          (click)="closeMobileMenu()"
        >
          ×
        </button>

        <strong>DataShare</strong>
      </div>

      <a
        class="mobile-drawer-history"
        routerLink="/history"
        (click)="closeMobileMenu()"
      >
        Mes fichiers
      </a>

      <a
        class="nav-login"
        routerLink="/login"
        (click)="closeMobileMenu()"
      >
        Se connecter
      </a>


      <a
        class="nav-register"
        routerLink="/register"
        (click)="closeMobileMenu()"
      >
        Créer un compte
      </a>


      <a
        class="nav-upload"
        routerLink="/upload"
        (click)="closeMobileMenu()"
      >Ajouter des fichiers</a>


      <a
        class="nav-history"
        routerLink="/history"
        (click)="closeMobileMenu()"
      >
        Mon espace
      </a>

      <button
        class="nav-logout"
        type="button"
        (click)="logout()"
      >
        <svg
          class="logout-icon"
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <path d="m16 17 5-5-5-5"/>
          <path d="M21 12H9"/>
        </svg>
        Déconnexion
      </button>

      <p class="mobile-drawer-copyright">
        Copyright DataShare® 2025
      </p>
    </nav>

  </header>


  <main class="app-content">

    <router-outlet></router-outlet>

  </main>

  <footer class="app-footer">
    <p>Copyright DataShare® 2025</p>
  </footer>

</div>
