spring.application.name=backend

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/datashare
spring.datasource.username=datashare
spring.datasource.password=${DB_PASSWORD}

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# La base DataShare existe déjà avant l'ajout de Flyway.
# Flyway crée donc son historique sans supprimer les données existantes.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Hibernate ne crée/modifie plus le schéma.
# Il vérifie uniquement que le schéma géré par Flyway correspond aux entités.
spring.jpa.hibernate.ddl-auto=validate

# JWT
jwt.secret=${JWT_SECRET}

# Upload
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB

# Structured logs
logging.file.name=logs/datashare.log
logging.structured.format.file=logstash

# Expired files cleanup
datashare.cleanup.initial-delay-ms=60000
datashare.cleanup.fixed-delay-ms=3600000